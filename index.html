<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云服务器连接测试</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033;display:grid;place-items:center;min-height:100vh}
    .card{width:min(92%,680px);background:#fff;border-radius:24px;padding:42px;box-shadow:0 18px 60px rgba(20,35,70,.12)}
    .badge{display:inline-block;padding:7px 12px;border-radius:999px;background:#e9f8ef;color:#18733b;font-weight:700;font-size:14px}
    h1{margin:18px 0 10px;font-size:36px}.desc{color:#667085;line-height:1.7}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0}.item{padding:16px;background:#f7f8fc;border-radius:14px}.label{font-size:12px;color:#8a93a3}.value{margin-top:6px;font-weight:700}
    button{border:0;border-radius:12px;padding:13px 18px;background:#172033;color:white;font-size:15px;cursor:pointer}button:hover{opacity:.9}
    #status{margin-top:18px;font-weight:600}
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">● Deployment Test</span>
    <h1>云服务器连接成功</h1>
    <p class="desc">这是一个由 GitHub Actions 部署测试生成的 HTML 页面。页面正常显示，说明网站文件已经准备就绪。</p>
    <section class="grid">
      <div class="item"><div class="label">服务器</div><div class="value">43.173.249.172</div></div>
      <div class="item"><div class="label">用户</div><div class="value">root</div></div>
      <div class="item"><div class="label">部署目录</div><div class="value">/var/www/111</div></div>
    </section>
    <button onclick="check()">运行浏览器测试</button>
    <div id="status">等待测试…</div>
  </main>
  <script>
    function check(){
      document.getElementById('status').textContent =
        '✓ HTML / CSS / JavaScript 均正常运行 · ' + new Date().toLocaleString('zh-CN');
    }
  </script>
</body>
</html>
