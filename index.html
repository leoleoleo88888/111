<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>111 · Frontend Test</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#111827,#2563eb);color:#fff}
    .card{width:min(680px,92vw);padding:48px;border-radius:28px;background:rgba(255,255,255,.12);backdrop-filter:blur(16px);box-shadow:0 24px 80px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.18)}
    .tag{display:inline-block;padding:7px 12px;border-radius:999px;background:#22c55e;color:#062e16;font-weight:800;font-size:13px}
    h1{font-size:clamp(40px,8vw,72px);line-height:1;margin:20px 0 14px}
    p{color:#dbeafe;line-height:1.8}
    .checks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:30px 0}
    .check{padding:18px;border-radius:16px;background:rgba(255,255,255,.1)}
    .check strong{display:block;margin-bottom:5px}
    button{border:0;padding:13px 18px;border-radius:12px;background:#fff;color:#111827;font-weight:800;cursor:pointer}
    button:hover{transform:translateY(-1px)}
    #result{margin-top:18px;color:#bbf7d0;font-weight:700}
    @media(max-width:560px){.card{padding:30px}.checks{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">✓ DEPLOYMENT TEST</span>
    <h1>Hello, 111!</h1>
    <p>这是一个简单的前端测试页面，用来验证 GitHub 推送和网页部署是否正常。</p>
    <section class="checks">
      <div class="check"><strong>HTML</strong>✓ 已加载</div>
      <div class="check"><strong>CSS</strong>✓ 已加载</div>
      <div class="check"><strong>JavaScript</strong>✓ 已加载</div>
    </section>
    <button onclick="runTest()">点击测试 JavaScript</button>
    <div id="result">等待测试…</div>
  </main>
  <script>
    function runTest(){
      document.getElementById('result').textContent =
        '✓ JavaScript 运行正常 · ' + new Date().toLocaleString('zh-CN');
    }
  </script>
</body>
</html>
