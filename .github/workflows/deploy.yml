name: Deploy to Tencent Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          set -e
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"
          echo "SERVER_HOST: configured"
          echo "SERVER_USER: configured"
          echo "SERVER_PORT: $SERVER_PORT"
          echo "SERVER_SSH_KEY: configured"

      - name: Deploy website and configure Nginx
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            if [ "$(id -u)" -eq 0 ]; then
              SUDO=""
            else
              SUDO="sudo"
            fi

            echo "=== Deploy files ==="
            $SUDO mkdir -p /var/www/111
            cd /var/www/111

            if [ ! -d .git ]; then
              $SUDO git clone https://github.com/leoleoleo88888/111.git .
            else
              $SUDO git fetch origin main
              $SUDO git reset --hard origin/main
            fi

            echo "=== Prepare /tmp and install Nginx if needed ==="
            $SUDO chmod 1777 /tmp
            if command -v nginx >/dev/null 2>&1; then
              echo "Nginx already installed."
            elif command -v apt-get >/dev/null 2>&1; then
              $SUDO apt-get update
              $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y nginx
            elif command -v dnf >/dev/null 2>&1; then
              $SUDO dnf install -y nginx
            elif command -v yum >/dev/null 2>&1; then
              $SUDO yum install -y nginx
            else
              echo "ERROR: Unsupported Linux package manager."
              exit 1
            fi

            echo "=== Configure Nginx ==="
            $SUDO mkdir -p /var/www/111
            $SUDO chown -R www-data:www-data /var/www/111 2>/dev/null || true
            $SUDO chown -R nginx:nginx /var/www/111 2>/dev/null || true

            $SUDO tee /etc/nginx/conf.d/111.conf >/dev/null <<'NGINX'
            server {
                listen 80 default_server;
                listen [::]:80 default_server;
                server_name _;
                root /var/www/111;
                index index.html;

                location / {
                    try_files $uri $uri/ /index.html;
                }
            }
            NGINX

            if [ -d /etc/nginx/sites-enabled ]; then
              $SUDO rm -f /etc/nginx/sites-enabled/default
            fi

            $SUDO nginx -t
            $SUDO systemctl enable nginx
            $SUDO systemctl restart nginx

            echo "=== Verify website locally ==="
            $SUDO ss -lntp | grep -E ':80[[:space:]]' || true
            curl -I --max-time 10 http://127.0.0.1/
            echo "=== Website deployment completed ==="

      - name: Deployment summary
        if: success()
        run: echo "Website deployed and Nginx configured successfully."
