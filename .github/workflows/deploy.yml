name: Deploy to Tencent Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -e
          test -n "$SERVER_HOST" || { echo "ERROR: SERVER_HOST is empty or missing"; exit 1; }
          test -n "$SERVER_USER" || { echo "ERROR: SERVER_USER is empty or missing"; exit 1; }
          test -n "$SERVER_SSH_KEY" || { echo "ERROR: SERVER_SSH_KEY is empty or missing"; exit 1; }
          echo "SERVER_HOST: configured"
          echo "SERVER_USER: configured"
          echo "SERVER_SSH_KEY: configured"
          echo "SSH key format: $(printf '%s' "$SERVER_SSH_KEY" | head -n 1)"
          echo "Secret checks passed."

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "SSH connection succeeded."
            mkdir -p /var/www/111
            cd /var/www/111
            if [ ! -d .git ]; then
              git clone https://github.com/leoleoleo88888/111.git .
            else
              git fetch origin main
              git reset --hard origin/main
            fi
            echo "Deployment completed."

      - name: Deployment summary
        if: success()
        run: echo "Cloud server deployment completed successfully."
