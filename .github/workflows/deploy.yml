name: Deploy MENA ICT Insight to Cloud Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to 43.173.249.172
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            git config --global --add safe.directory /var/www/111
            cd /var/www/111
            git fetch origin main
            git reset --hard origin/main

            cat > /etc/nginx/conf.d/mena-ict.conf <<'EOF'
            server {
                listen 80 default_server;
                server_name 43.173.249.172 _;
                root /var/www/111;
                index index.html index.htm;
                location / {
                    try_files $uri $uri/ /index.html;
                }
            }
            EOF

            nginx -t
            systemctl reload nginx

            echo "Current deployed commit:"
            git rev-parse HEAD
            echo "Current index file:"
            ls -l /var/www/111/index.html
            echo "Nginx root:"
            nginx -T | grep '/var/www/111' || true

            echo "Cloud deployment complete"

      - name: Deployment finished
        run: echo "MENA ICT Insight cloud deployment triggered"
